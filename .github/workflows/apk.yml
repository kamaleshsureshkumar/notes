name: Build Kivy Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses6 libncursesw6 libffi-dev libssl-dev build-essential \
          ccache libltdl-dev wget

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Setup Global Android SDK & Command-Line Tools
      run: |
        export ANDROID_HOME=/opt/android-sdk
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        sudo chmod -R 777 $ANDROID_HOME

        # Download official Android Command-Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extracted
        sudo mv /tmp/cmdtools-extracted/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        # Create the legacy tools/bin symlink structure inside /opt/android-sdk so python-for-android finds it
        sudo mkdir -p $ANDROID_HOME/tools/bin
        sudo ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

        # Export environment variables globally for the runner
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.b" >> $GITHUB_ENV
        
        # Accept licenses and install platform tools
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Build APK with Buildozer
      working-directory: src
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: src/bin/*.apk