name: Build Kivy Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses6 libncursesw6 libffi-dev libssl-dev build-essential \
          ccache libltdl-dev wget

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Force-Fix SDK and Legacy tools/bin/sdkmanager Path
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        
        echo "Downloading Android Command-Line Tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extracted
        
        # Move command-line tools contents into 'latest'
        mv /tmp/cmdtools-extracted/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        
        # CRITICAL FIX: Create the legacy 'tools/bin' directory and symlink sdkmanager 
        # so python-for-android stops throwing the 'sdkmanager is not installed' error
        mkdir -p "$SDK_DIR/tools/bin"
        ln -s "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        ln -s "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"

        # Pre-accept licenses so buildozer doesn't block
        export PATH="$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/tools/bin"
        yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true
        sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Build APK with Buildozer
      working-directory: src
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: src/bin/*.apk