name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3 python3-pip python3-setuptools \
          git zip unzip openjdk-17-jdk \
          libncurses5 libstdc++6 libffi-dev libssl-dev \
          libsqlite3-dev libjpeg-dev libpng-dev

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Install Android SDK/NDK
      run: |
        sudo apt install -y wget
        mkdir -p $HOME/android
        cd $HOME/android
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d cmdline-tools
        yes | cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Build APK
      env:
        ANDROIDSDK: $HOME/android
        ANDROIDNDK: $HOME/android/ndk/25.2.9519653
      run: |
        buildozer android release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk
        path: bin/*.apk
