name: Build Kivy Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /opt/Android/Sdk
      ANDROID_SDK_ROOT: /opt/Android/Sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses6 libncursesw6 libffi-dev libssl-dev build-essential \
            ccache libltdl-dev wget ca-certificates

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -sfn "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk

          echo "SDK path:"
          ls -ld "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk
          echo "sdkmanager path:"
          command -v sdkmanager
          sdkmanager --list | head -n 20

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade "pip<24"
          python -m pip install --upgrade \
            "setuptools<70" \
            "wheel" \
            "cython<3.0.0" \
            "sh<2.0" \
            "buildozer==1.5.0" \
            "python-for-android==2024.01.21"

      - name: Build APK with Buildozer
        working-directory: src
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-android-apk
          path: src/bin/*.apk