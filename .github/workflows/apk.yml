name: Build Kivy Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /opt/Android/Sdk
      ANDROID_SDK_ROOT: /opt/Android/Sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip curl build-essential pkg-config \
            libssl-dev libffi-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libncursesw5-dev \
            libncursesw6 wget ca-certificates autoconf libtool

      - name: Install Android command line tools
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip

          rm -rf /tmp/cmdline-tools
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          # Buildozer sometimes expects legacy path
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager" || true

      - name: Install Android packages
        run: |
          set -eux
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses
          "$ANDROID_HOME/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Configure Buildozer SDK path
        run: |
          set -eux
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -sfn "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk

      - name: Install compatible Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "sh<2.0" "cython<3.0.0" "buildozer==1.5.0" "python-for-android==2024.01.21"

      - name: Build APK
        working-directory: src
        run: |
          set -eux
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: src/bin/*.apk