name: Build Kivy Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses6 libncursesw6 libffi-dev libssl-dev build-essential \
          ccache libltdl-dev wget

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Fix Android SDK Command-Line Tools for Buildozer
      run: |
        # Create standard buildozer android SDK folders
        ANDROID_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_SDK_DIR/tools/bin"
        
        # Download official Android Command-Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-temp
        
        # Structure them so legacy buildozer scripts can find 'tools/bin/sdkmanager'
        mkdir -p /tmp/cmdtools-temp/cmdline-tools/latest
        mv /tmp/cmdtools-temp/cmdline-tools/bin /tmp/cmdtools-temp/cmdline-tools/latest/
        mv /tmp/cmdtools-temp/cmdline-tools/lib /tmp/cmdtools-temp/cmdline-tools/latest/
        mv /tmp/cmdtools-temp/cmdline-tools/source.properties /tmp/cmdtools-temp/cmdline-tools/latest/ || true
        
        cp -r /tmp/cmdtools-temp/cmdline-tools/* "$ANDROID_SDK_DIR/"
        ln -s "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_DIR/tools/bin/sdkmanager" || true

    - name: Build APK with Buildozer
      working-directory: src
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: src/bin/*.apk